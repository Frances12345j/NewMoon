<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Loading Animations</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 8px;
    font-size: 28px;
    color: #fff;
}
.subtitle {
    text-align: center;
    margin-bottom: 40px;
    color: #888;
    font-size: 14px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto;
}

.card {
    background: #16213e;
    border-radius: 12px;
    padding: 30px 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid #1a1a3e;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(52, 152, 219, 0.15);
}

.preview {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.label {
    font-size: 13px;
    color: #aaa;
    font-weight: 500;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #f3f3f3;
    border-top: 4px solid #3498db;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
.dots {
    display: flex;
    gap: 8px;
    align-items: center;
}
.dot {
    width: 12px;
    height: 12px;
    background: #3498db;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
}
.dot:nth-child(1) { animation-delay: -0.32s; }
.dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}
.pulse {
    width: 40px;
    height: 40px;
    background: #3498db;
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
    0% { transform: scale(0.5); opacity: 1; }
    100% { transform: scale(1.2); opacity: 0; }
}
.bars {
    display: flex;
    gap: 4px;
    align-items: center;
    height: 40px;
}
.bar {
    width: 6px;
    height: 100%;
    background: #3498db;
    animation: bar-pulse 1s ease-in-out infinite;
}
.bar:nth-child(1) { animation-delay: 0s; }
.bar:nth-child(2) { animation-delay: 0.1s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.3s; }
.bar:nth-child(5) { animation-delay: 0.4s; }
@keyframes bar-pulse {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
}
.ring {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(52, 152, 219, 0.2);
    border-top-color: #3498db;
    border-radius: 50%;
    animation: ring-spin 1s linear infinite;
}
@keyframes ring-spin {
    to { transform: rotate(360deg); }
}
.dual-ring {
    width: 44px;
    height: 44px;
    position: relative;
}
.dual-ring, .dual-ring-inner {
    border: 4px solid transparent;
    border-radius: 50%;
}
.dual-ring {
    border-top-color: #3498db;
    animation: dual-spin 1.2s linear infinite;
}
.dual-ring-inner {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border-bottom-color: #e74c3c;
    animation: dual-spin 0.8s linear infinite reverse;
}
@keyframes dual-spin {
    to { transform: rotate(360deg); }
}
.grid-loader {
    display: grid;
    grid-template-columns: repeat(3, 12px);
    gap: 4px;
}
.grid-cell {
    width: 12px;
    height: 12px;
    background: #3498db;
    animation: grid-fade 1.3s ease-in-out infinite;
}
.grid-cell:nth-child(1) { animation-delay: 0s; }
.grid-cell:nth-child(2) { animation-delay: 0.1s; }
.grid-cell:nth-child(3) { animation-delay: 0.2s; }
.grid-cell:nth-child(4) { animation-delay: 0.1s; }
.grid-cell:nth-child(5) { animation-delay: 0.2s; }
.grid-cell:nth-child(6) { animation-delay: 0.3s; }
.grid-cell:nth-child(7) { animation-delay: 0.2s; }
.grid-cell:nth-child(8) { animation-delay: 0.3s; }
.grid-cell:nth-child(9) { animation-delay: 0.4s; }
@keyframes grid-fade {
    0%, 70%, 100% { opacity: 0.3; transform: scale(0.6); }
    35% { opacity: 1; transform: scale(1); }
}
.skeleton {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 200px;
}
.skeleton-line {
    height: 14px;
    background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
    background-size: 200% 100%;
    border-radius: 4px;
    animation: shimmer 1.5s infinite;
}
.skeleton-line-lg { width: 100%; }
.skeleton-line-md { width: 80%; }
.skeleton-line-sm { width: 50%; }
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
.orbit {
    width: 48px;
    height: 48px;
    position: relative;
}
.orbit-center {
    width: 12px;
    height: 12px;
    background: #3498db;
    border-radius: 50%;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
}
.orbit-ring {
    width: 100%;
    height: 100%;
    border: 3px solid rgba(52, 152, 219, 0.2);
    border-top-color: #3498db;
    border-radius: 50%;
    animation: ring-spin 1s linear infinite;
}
.wave {
    display: flex;
    gap: 3px;
    align-items: center;
    height: 40px;
}
.wave-bar {
    width: 4px;
    height: 20px;
    background: #3498db;
    border-radius: 2px;
    animation: wave-anim 1.2s ease-in-out infinite;
}
.wave-bar:nth-child(1) { animation-delay: 0s; }
.wave-bar:nth-child(2) { animation-delay: 0.1s; }
.wave-bar:nth-child(3) { animation-delay: 0.2s; }
.wave-bar:nth-child(4) { animation-delay: 0.3s; }
.wave-bar:nth-child(5) { animation-delay: 0.4s; }
@keyframes wave-anim {
    0%, 100% { height: 20px; }
    50% { height: 40px; }
}
.progress-container {
    width: 200px;
    height: 6px;
    background: #e0e0e0;
    border-radius: 3px;
    overflow: hidden;
}
.progress-bar {
    width: 40%;
    height: 100%;
    background: #3498db;
    border-radius: 3px;
    animation: progress-slide 1.5s ease-in-out infinite;
}
@keyframes progress-slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
}
.heartbeat {
    font-size: 32px;
    color: #e74c3c;
    animation: heartbeat 1.2s ease-in-out infinite;
}
@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.3); }
    28% { transform: scale(1); }
    42% { transform: scale(1.3); }
    70% { transform: scale(1); }
}
.ellipsis {
    display: flex;
    gap: 4px;
    font-size: 28px;
    font-weight: bold;
    color: #3498db;
}
.ellipsis-dot {
    width: 8px;
    height: 8px;
    background: #3498db;
    border-radius: 50%;
    animation: ellipsis-bounce 1.4s infinite ease-in-out both;
}
.ellipsis-dot:nth-child(1) { animation-delay: -0.32s; }
.ellipsis-dot:nth-child(2) { animation-delay: -0.16s; }
.ellipsis-dot:nth-child(3) { animation-delay: 0s; }
.ellipsis-dot:nth-child(4) { animation-delay: 0.16s; }
@keyframes ellipsis-bounce {
    0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
}
.cube-loader {
    width: 40px;
    height: 40px;
    position: relative;
    transform-style: preserve-3d;
    animation: cube-rotate 2s linear infinite;
}
.cube-face {
    position: absolute;
    width: 40px;
    height: 40px;
    background: rgba(52, 152, 219, 0.8);
    border: 2px solid rgba(255,255,255,0.3);
}
.cube-front  { transform: translateZ(20px); }
.cube-back   { transform: rotateY(180deg) translateZ(20px); }
.cube-right  { transform: rotateY(90deg) translateZ(20px); }
.cube-left   { transform: rotateY(-90deg) translateZ(20px); }
.cube-top    { transform: rotateX(90deg) translateZ(20px); }
.cube-bottom { transform: rotateX(-90deg) translateZ(20px); }
@keyframes cube-rotate {
    0% { transform: rotateX(0deg) rotateY(0deg); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
}
</style>
</head>
<body>
<h1>Web Loading Animations</h1>
<p class="subtitle">14 CSS-only loaders &mdash; zero dependencies</p>
<div class="grid">
        <div class="card">
            <div class="preview"><div class="spinner"></div></div>
            <div class="label">Spinner</div>
        </div>
        <div class="card">
            <div class="preview"><div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div></div>
            <div class="label">Bouncing Dots</div>
        </div>
        <div class="card">
            <div class="preview"><div class="pulse"></div></div>
            <div class="label">Pulse</div>
        </div>
        <div class="card">
            <div class="preview"><div class="bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div></div>
            <div class="label">Bars</div>
        </div>
        <div class="card">
            <div class="preview"><div class="ring"></div></div>
            <div class="label">Ring</div>
        </div>
        <div class="card">
            <div class="preview"><div class="dual-ring">
    <div class="dual-ring-inner"></div>
</div></div>
            <div class="label">Dual Ring</div>
        </div>
        <div class="card">
            <div class="preview"><div class="grid-loader">
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
</div></div>
            <div class="label">Grid</div>
        </div>
        <div class="card">
            <div class="preview"><div class="skeleton">
    <div class="skeleton-line skeleton-line-lg"></div>
    <div class="skeleton-line skeleton-line-md"></div>
    <div class="skeleton-line skeleton-line-sm"></div>
</div></div>
            <div class="label">Skeleton Shimmer</div>
        </div>
        <div class="card">
            <div class="preview"><div class="orbit">
    <div class="orbit-center"></div>
    <div class="orbit-ring"></div>
</div></div>
            <div class="label">Orbit</div>
        </div>
        <div class="card">
            <div class="preview"><div class="wave">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
</div></div>
            <div class="label">Wave</div>
        </div>
        <div class="card">
            <div class="preview"><div class="progress-container">
    <div class="progress-bar"></div>
</div></div>
            <div class="label">Progress Bar</div>
        </div>
        <div class="card">
            <div class="preview"><div class="heartbeat">&#10084;</div></div>
            <div class="label">Heartbeat</div>
        </div>
        <div class="card">
            <div class="preview"><div class="ellipsis">
    <div class="ellipsis-dot"></div>
    <div class="ellipsis-dot"></div>
    <div class="ellipsis-dot"></div>
    <div class="ellipsis-dot"></div>
</div></div>
            <div class="label">Ellipsis</div>
        </div>
        <div class="card">
            <div class="preview"><div class="cube-loader">
    <div class="cube-face cube-front"></div>
    <div class="cube-face cube-back"></div>
    <div class="cube-face cube-right"></div>
    <div class="cube-face cube-left"></div>
    <div class="cube-face cube-top"></div>
    <div class="cube-face cube-bottom"></div>
</div></div>
            <div class="label">Rotating Cube</div>
        </div></div>
</body>
</html>
