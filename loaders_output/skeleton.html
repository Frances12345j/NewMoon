<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Skeleton Shimmer</title>
<style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background:#1a1a2e; }
.skeleton {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 200px;
}
.skeleton-line {
    height: 14px;
    background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
    background-size: 200% 100%;
    border-radius: 4px;
    animation: shimmer 1.5s infinite;
}
.skeleton-line-lg { width: 100%; }
.skeleton-line-md { width: 80%; }
.skeleton-line-sm { width: 50%; }
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}
</style>
</head><body>
<div class="skeleton">
    <div class="skeleton-line skeleton-line-lg"></div>
    <div class="skeleton-line skeleton-line-md"></div>
    <div class="skeleton-line skeleton-line-sm"></div>
</div>
</body></html>
