<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Bars</title>
<style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background:#1a1a2e; }
.bars {
    display: flex;
    gap: 4px;
    align-items: center;
    height: 40px;
}
.bar {
    width: 6px;
    height: 100%;
    background: #3498db;
    animation: bar-pulse 1s ease-in-out infinite;
}
.bar:nth-child(1) { animation-delay: 0s; }
.bar:nth-child(2) { animation-delay: 0.1s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.3s; }
.bar:nth-child(5) { animation-delay: 0.4s; }
@keyframes bar-pulse {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
}
</style>
</head><body>
<div class="bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>
</body></html>
