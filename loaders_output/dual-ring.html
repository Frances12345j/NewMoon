<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Dual Ring</title>
<style>
body { display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background:#1a1a2e; }
.dual-ring {
    width: 44px;
    height: 44px;
    position: relative;
}
.dual-ring, .dual-ring-inner {
    border: 4px solid transparent;
    border-radius: 50%;
}
.dual-ring {
    border-top-color: #3498db;
    animation: dual-spin 1.2s linear infinite;
}
.dual-ring-inner {
    position: absolute;
    top: 4px; left: 4px; right: 4px; bottom: 4px;
    border-bottom-color: #e74c3c;
    animation: dual-spin 0.8s linear infinite reverse;
}
@keyframes dual-spin {
    to { transform: rotate(360deg); }
}
</style>
</head><body>
<div class="dual-ring">
    <div class="dual-ring-inner"></div>
</div>
</body></html>
